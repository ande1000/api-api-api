<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>whats web app</title>
<style>
  :root {
    --blue: #1FA6E0;
    --green: #1FD65F;
    --green-dark: #17A84B;
    --red: #E5352B;
    --black: #0B0B0B;
    --grey-dark: #4A4A4A;
    --grey-bubble: #4D4D4D;
    --white: #FFFFFF;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    height: 100%;
    font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
    background: var(--black);
    overflow: hidden;
  }
  .screen {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
  }
  .screen.active { display: flex; }

  /* ---------- Splash ---------- */
  #screen-splash {
    background: var(--black);
    align-items: center;
    justify-content: space-between;
    padding: 60px 24px;
    text-align: center;
  }
  #screen-splash .title-block { margin-top: 90px; }
  #screen-splash h1 {
    color: var(--white);
    font-size: 1.9rem;
    font-weight: 800;
    margin: 0;
    letter-spacing: 0.5px;
  }
  #screen-splash .sub {
    color: var(--green);
    font-weight: 700;
    font-size: 0.85rem;
    margin-top: 6px;
  }
  .round-btn {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    background: var(--green);
    color: var(--red);
    font-weight: 800;
    font-size: 1.15rem;
    border: none;
    cursor: pointer;
    margin-bottom: 40px;
  }
  .round-btn:active { background: var(--green-dark); }

  /* ---------- Criar usuário ---------- */
  #screen-create-user {
    background: var(--black);
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 18px;
    overflow-y: auto;
  }
  #screen-create-user h1 {
    color: var(--white);
    font-size: 1.4rem;
    font-weight: 800;
    margin: 0 0 4px;
  }
  .photo-picker {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: var(--white);
    color: var(--red);
    font-weight: 800;
    font-size: 0.95rem;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1.2;
    overflow: hidden;
    padding: 0;
  }
  .photo-picker img { width: 100%; height: 100%; object-fit: cover; }
  .field {
    width: 100%;
    max-width: 320px;
    padding: 14px 16px;
    border-radius: 8px;
    border: none;
    background: var(--white);
    font-size: 1rem;
  }
  .field:focus { outline: 3px solid var(--blue); }
  .btn-green {
    background: var(--green);
    color: #0B3D1E;
    border: none;
    padding: 12px 30px;
    border-radius: 8px;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
  }
  .btn-green:active { background: var(--green-dark); }
  .error-text {
    color: #FF8A80;
    font-size: 0.85rem;
    min-height: 18px;
    text-align: center;
  }

  /* ---------- Tela principal (lista de contatos) ---------- */
  #screen-main { background: var(--black); }
  .topbar {
    background: var(--blue);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .topbar h1 {
    color: var(--white);
    font-size: 1.5rem;
    font-weight: 800;
    margin: 0;
  }
  .topbar .logout-link {
    color: rgba(255,255,255,0.85);
    font-size: 0.8rem;
    text-decoration: underline;
    cursor: pointer;
  }
  .contact-list { flex: 1; overflow-y: auto; padding: 8px 0; }
  .contact-row {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    cursor: pointer;
  }
  .contact-row:active { background: #1a1a1a; }
  .avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--green);
    color: #0B3D1E;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.1rem;
    flex-shrink: 0;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .contact-info { flex: 1; min-width: 0; }
  .contact-name {
    color: var(--white);
    font-size: 1.05rem;
    font-weight: 600;
  }
  .contact-status {
    color: #8a8a8a;
    font-size: 0.78rem;
    margin-top: 2px;
  }
  .contact-status.online { color: var(--green); }
  .trash-btn {
    background: none;
    border: none;
    color: var(--red);
    font-size: 1.25rem;
    cursor: pointer;
    padding: 6px;
    flex-shrink: 0;
    line-height: 0;
  }
  .unread-badge {
    background: var(--green);
    color: #0B3D1E;
    font-weight: 800;
    font-size: 0.75rem;
    min-width: 22px;
    height: 22px;
    border-radius: 11px;
    padding: 0 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .empty-contacts {
    color: #888;
    text-align: center;
    padding: 60px 30px;
    line-height: 1.6;
    font-size: 0.95rem;
  }
  .fab {
    position: absolute;
    right: 22px;
    bottom: 26px;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: var(--green);
    color: #0B3D1E;
    font-size: 1.8rem;
    font-weight: 800;
    border: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    cursor: pointer;
    line-height: 0;
  }
  .fab:active { background: var(--green-dark); }

  /* ---------- Adicionar usuário ---------- */
  #screen-add-user {
    background: var(--grey-dark);
    align-items: center;
    justify-content: center;
    padding: 24px;
    gap: 20px;
    position: relative;
  }
  #screen-add-user h1 {
    color: var(--red);
    font-size: 1.5rem;
    font-weight: 800;
    margin: 0 0 6px;
  }
  .back-arrow {
    position: absolute;
    top: 18px;
    left: 18px;
    color: var(--white);
    font-size: 1.6rem;
    background: none;
    border: none;
    cursor: pointer;
  }
  .round-btn-sm {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    background: var(--green);
    color: #0B3D1E;
    font-weight: 800;
    font-size: 0.85rem;
    border: none;
    cursor: pointer;
    line-height: 1.2;
  }
  .round-btn-sm:active { background: var(--green-dark); }

  /* ---------- Conversa ---------- */
  #screen-chat { background: var(--grey-dark); }
  .chat-topbar {
    background: var(--blue);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: relative;
  }
  .chat-topbar .back-arrow { position: static; color: #14324a; }
  .chat-header-pill {
    flex: 1;
    background: rgba(255,255,255,0.92);
    border-radius: 22px;
    padding: 6px 14px 6px 6px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
    cursor: pointer;
  }
  .chat-header-pill .avatar { width: 38px; height: 38px; font-size: 0.95rem; }
  .chat-header-text { min-width: 0; }
  .chat-header-text .name {
    color: var(--red);
    font-weight: 800;
    font-size: 0.95rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-header-text .status {
    font-size: 0.72rem;
    font-weight: 700;
    color: #777;
  }
  .chat-header-text .status.online { color: var(--green-dark); }
  .icon-btn {
    background: none;
    border: none;
    color: #14324a;
    font-size: 1.35rem;
    cursor: pointer;
    padding: 4px 6px;
    flex-shrink: 0;
    line-height: 0;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble-row { display: flex; }
  .bubble-row.me { justify-content: flex-end; }
  .bubble {
    max-width: 72%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 0.96rem;
    line-height: 1.4;
    color: var(--white);
  }
  .bubble-row.them .bubble { background: var(--grey-bubble); border-bottom-left-radius: 3px; }
  .bubble-row.me .bubble { background: var(--green-dark); border-bottom-right-radius: 3px; }
  .bubble img { max-width: 100%; border-radius: 8px; display: block; }
  .composer {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px;
    background: #3a3a3a;
  }
  .photo-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--red);
    color: var(--white);
    font-size: 1.4rem;
    font-weight: 800;
    border: none;
    cursor: pointer;
    flex-shrink: 0;
    line-height: 0;
  }
  .composer input[type="text"] {
    flex: 1;
    padding: 12px 16px;
    border-radius: 22px;
    border: none;
    background: var(--white);
    font-size: 0.95rem;
  }
  .send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--green);
    color: #0B3D1E;
    font-size: 1.2rem;
    font-weight: 800;
    border: none;
    cursor: pointer;
    flex-shrink: 0;
  }
  .send-btn:active { background: var(--green-dark); }

  /* ---------- Menu popup (apagar histórico) ---------- */
  .popup-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: flex-start;
    justify-content: flex-end;
    z-index: 50;
    padding: 60px 16px 0 0;
  }
  .popup-overlay.active { display: flex; }
  .popup-menu {
    background: var(--white);
    border-radius: 10px;
    overflow: hidden;
    min-width: 220px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.3);
  }
  .popup-menu button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 14px 18px;
    font-size: 0.95rem;
    color: var(--red);
    font-weight: 700;
    cursor: pointer;
  }
  .popup-menu button:active { background: #f2f2f2; }

  /* ---------- Chamada de voz ---------- */
  #screen-call {
    background: var(--black);
    align-items: center;
    justify-content: space-between;
    padding: 50px 24px 60px;
  }
  .call-name-pill {
    background: var(--white);
    border-radius: 22px;
    padding: 10px 26px;
    color: var(--red);
    font-weight: 800;
    font-size: 1.05rem;
    text-align: center;
    max-width: 90%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .call-avatar-big {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: var(--white);
    color: var(--red);
    font-weight: 800;
    font-size: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
  }
  .call-avatar-big img { width: 100%; height: 100%; object-fit: cover; }
  .call-status-text {
    color: var(--white);
    font-size: 1rem;
    margin-top: 14px;
    text-align: center;
  }
  .call-controls-row {
    display: flex;
    gap: 30px;
    align-items: center;
  }
  .call-btn-round {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: none;
    font-size: 1.6rem;
    cursor: pointer;
    color: var(--white);
  }
  .call-btn-round.accept { background: var(--green); }
  .call-btn-round.reject, .call-btn-round.hangup { background: var(--red); }
  .call-btn-round.mute { background: #333; font-size: 1.3rem; }
  .call-btn-round.mute.active { background: var(--blue); }

  .chat-call-btn { color: #14324a; }
</style>
</head>
<body>

  <!-- TELA 1: Início -->
  <div class="screen active" id="screen-splash">
    <div class="title-block">
      <h1>WHATS WEB APP</h1>
      <p class="sub">SEU APLICATIVO DE CONVERSA</p>
    </div>
    <button class="round-btn" onclick="goTo('screen-create-user')">INICIA</button>
  </div>

  <!-- TELA 2: Criar usuário -->
  <div class="screen" id="screen-create-user">
    <h1>CRIA SEU USUARIO</h1>
    <button class="photo-picker" id="photo-picker-btn" onclick="document.getElementById('create-avatar-input').click()">Editar<br/>foto</button>
    <input type="file" id="create-avatar-input" accept="image/*" style="display:none" onchange="onCreateAvatarSelected(event)" />
    <input class="field" id="create-username" placeholder="crei usuario" autocomplete="off" />
    <p class="error-text" id="create-error"></p>
    <button class="btn-green" onclick="createUser()">CRIAR</button>
  </div>

  <!-- TELA 3: Principal (lista de contatos) -->
  <div class="screen" id="screen-main">
    <div class="topbar">
      <h1>whats web</h1>
      <span class="logout-link" onclick="logout()">sair</span>
    </div>
    <div class="contact-list" id="contact-list"></div>
    <button class="fab" onclick="goTo('screen-add-user')">+</button>
  </div>

  <!-- TELA 4: Adicionar usuário -->
  <div class="screen" id="screen-add-user">
    <button class="back-arrow" onclick="goTo('screen-main')">←</button>
    <h1>adiciona usuario</h1>
    <input class="field" id="add-username" placeholder="diginte o nome do usuario" autocomplete="off" />
    <p class="error-text" id="add-error"></p>
    <button class="round-btn-sm" onclick="addContact()">salvar<br/>usuario</button>
  </div>

  <!-- TELA 5: Conversa -->
  <div class="screen" id="screen-chat">
    <div class="chat-topbar">
      <button class="back-arrow" onclick="goTo('screen-main')">←</button>
      <div class="chat-header-pill" id="chat-header-pill">
        <div class="avatar" id="chat-avatar"></div>
        <div class="chat-header-text">
          <div class="name" id="chat-contact-name"></div>
          <div class="status" id="chat-contact-status">offline</div>
        </div>
      </div>
      <button class="icon-btn chat-call-btn" onclick="startCall()" title="Ligar">☎</button>
      <button class="icon-btn" onclick="toggleChatMenu()" title="Mais opções">⋮</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <button class="photo-btn" onclick="document.getElementById('photo-input').click()">+</button>
      <input type="file" id="photo-input" accept="image/*" style="display:none" onchange="sendPhoto(event)" />
      <input type="text" id="message-input" placeholder="diginta sua mesagem aqui" autocomplete="off" />
      <button class="send-btn" onclick="sendMessage()">✓</button>
    </div>
  </div>

  <!-- Popup do menu (⋮) -->
  <div class="popup-overlay" id="chat-menu-overlay" onclick="closeChatMenuIfOutside(event)">
    <div class="popup-menu">
      <button onclick="deleteHistory()">Apagar histórico de conversa</button>
    </div>
  </div>

  <!-- TELA 6: Chamada de voz -->
  <div class="screen" id="screen-call">
    <div class="call-name-pill" id="call-name-pill"></div>
    <div>
      <div class="call-avatar-big" id="call-avatar-big"></div>
      <p class="call-status-text" id="call-status-text"></p>
    </div>
    <div class="call-controls-row" id="call-controls-outgoing" style="display:none;">
      <button class="call-btn-round hangup" onclick="endCall(true)">☎</button>
    </div>
    <div class="call-controls-row" id="call-controls-incoming" style="display:none;">
      <button class="call-btn-round accept" onclick="acceptCall()">✓</button>
      <button class="call-btn-round reject" onclick="rejectCall()">✕</button>
    </div>
    <div class="call-controls-row" id="call-controls-active" style="display:none;">
      <button class="call-btn-round mute" id="mute-btn" onclick="toggleMute()">🎤</button>
      <button class="call-btn-round hangup" onclick="endCall(true)">☎</button>
    </div>
  </div>

  <audio id="remote-audio" autoplay></audio>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const STORAGE_TOKEN = 'whatsweb_token';
    const STORAGE_USERNAME = 'whatsweb_username';
    const STORAGE_AVATAR = 'whatsweb_avatar';
    const STORAGE_CONTACTS = 'whatsweb_contacts';

    let token = localStorage.getItem(STORAGE_TOKEN);
    let myUsername = localStorage.getItem(STORAGE_USERNAME);
    let myAvatar = localStorage.getItem(STORAGE_AVATAR) || null;
    let contacts = JSON.parse(localStorage.getItem(STORAGE_CONTACTS) || '[]'); // [{username, avatar}]
    let socket = null;
    let currentChatUser = null;
    let pendingAvatarDataUrl = null;

    function goTo(screenId) {
      document.querySelectorAll('.screen').forEach((s) => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function normalize(name) {
      return String(name || '').trim().toLowerCase();
    }

    function saveContacts() {
      localStorage.setItem(STORAGE_CONTACTS, JSON.stringify(contacts));
    }

    function findContact(username) {
      return contacts.find((c) => c.username === username);
    }

    function renderAvatarInto(el, username, avatar) {
      el.innerHTML = '';
      if (avatar) {
        const img = document.createElement('img');
        img.src = avatar;
        el.appendChild(img);
      } else {
        el.textContent = (username || '?').charAt(0).toUpperCase();
      }
    }

    // ---------- Redimensiona uma imagem (usado para avatar e fotos enviadas) ----------
    function resizeImage(file, maxWidth, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement('canvas');
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // ---------- Tela 2: criar usuário ----------
    async function onCreateAvatarSelected(event) {
      const file = event.target.files[0];
      event.target.value = '';
      if (!file) return;
      pendingAvatarDataUrl = await resizeImage(file, 300, 0.85);
      const btn = document.getElementById('photo-picker-btn');
      btn.innerHTML = '';
      const img = document.createElement('img');
      img.src = pendingAvatarDataUrl;
      btn.appendChild(img);
    }

    async function createUser() {
      const input = document.getElementById('create-username');
      const errorEl = document.getElementById('create-error');
      const username = normalize(input.value);
      errorEl.textContent = '';

      if (!username) {
        errorEl.textContent = 'Digite um nome de usuário.';
        return;
      }

      try {
        const res = await fetch('/api/claim', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, avatar: pendingAvatarDataUrl }),
        });
        const data = await res.json();
        if (!res.ok) {
          errorEl.textContent = data.error || 'Não foi possível criar esse usuário.';
          return;
        }
        token = data.token;
        myUsername = data.username;
        myAvatar = data.avatar || null;
        localStorage.setItem(STORAGE_TOKEN, token);
        localStorage.setItem(STORAGE_USERNAME, myUsername);
        if (myAvatar) localStorage.setItem(STORAGE_AVATAR, myAvatar);
        requestNotificationPermission();
        connectSocket();
        renderContacts();
        goTo('screen-main');
      } catch (err) {
        errorEl.textContent = 'Erro de conexão. Tente novamente.';
      }
    }

    function logout() {
      localStorage.removeItem(STORAGE_TOKEN);
      localStorage.removeItem(STORAGE_USERNAME);
      localStorage.removeItem(STORAGE_AVATAR);
      localStorage.removeItem(STORAGE_CONTACTS);
      if (socket) socket.disconnect();
      token = null; myUsername = null; myAvatar = null; contacts = [];
      goTo('screen-splash');
    }

    // ---------- Tela 3: lista de contatos ----------
    function renderContacts() {
      const list = document.getElementById('contact-list');
      list.innerHTML = '';
      if (contacts.length === 0) {
        list.innerHTML = '<p class="empty-contacts">Você ainda não tem contatos.<br/>Toque no + para adicionar alguém pelo nome de usuário.</p>';
        return;
      }
      contacts.forEach((contact) => {
        const row = document.createElement('div');
        row.className = 'contact-row';

        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        renderAvatarInto(avatar, contact.username, contact.avatar);

        const info = document.createElement('div');
        info.className = 'contact-info';
        info.onclick = () => openChat(contact.username);

        const name = document.createElement('div');
        name.className = 'contact-name';
        name.textContent = contact.username;

        const status = document.createElement('div');
        status.className = 'contact-status' + (contact.online ? ' online' : '');
        status.textContent = contact.typing ? 'digitando...' : (contact.online ? 'online' : 'offline');

        info.appendChild(name);
        info.appendChild(status);

        row.appendChild(avatar);
        row.appendChild(info);

        if (contact.unread > 0) {
          const badge = document.createElement('div');
          badge.className = 'unread-badge';
          badge.textContent = contact.unread > 99 ? '99+' : String(contact.unread);
          row.appendChild(badge);
        }

        const trashBtn = document.createElement('button');
        trashBtn.className = 'trash-btn';
        trashBtn.textContent = '🗑';
        trashBtn.onclick = (e) => { e.stopPropagation(); removeContact(contact.username); };

        row.appendChild(trashBtn);
        list.appendChild(row);
      });
    }


    function removeContact(username) {
      if (!confirm('Apagar ' + username + ' dos seus contatos?')) return;
      contacts = contacts.filter((c) => c.username !== username);
      saveContacts();
      renderContacts();
    }

    // Atualiza avatar/status de um contato já salvo (chamado ao abrir a conversa e via presença)
    function updateContactInfo(username, changes) {
      const c = findContact(username);
      if (!c) return;
      Object.assign(c, changes);
      saveContacts();
      renderContacts();
    }

    // ---------- Tela 4: adicionar usuário ----------
    async function addContact() {
      const input = document.getElementById('add-username');
      const errorEl = document.getElementById('add-error');
      const username = normalize(input.value);
      errorEl.textContent = '';

      if (!username) {
        errorEl.textContent = 'Digite um nome de usuário.';
        return;
      }
      if (username === myUsername) {
        errorEl.textContent = 'Você não pode adicionar a si mesmo.';
        return;
      }

      try {
        const res = await fetch('/api/user/' + encodeURIComponent(username));
        if (res.status === 404) {
          errorEl.textContent = 'Esse usuário não existe. Peça pra pessoa criar o usuário dela primeiro.';
          return;
        }
        const profile = await res.json();
        if (!findContact(username)) {
          contacts.push({ username: profile.username, avatar: profile.avatar, online: profile.online });
          saveContacts();
          renderContacts();
        }
        input.value = '';
        openChat(username);
      } catch (err) {
        errorEl.textContent = 'Erro de conexão. Tente novamente.';
      }
    }

    // ---------- Tela 5: conversa ----------
    async function openChat(user) {
      currentChatUser = user;
      document.getElementById('chat-contact-name').textContent = user;
      document.getElementById('messages').innerHTML = '';
      goTo('screen-chat');

      // Zera o contador de mensagens não lidas desse contato
      const contactEntry = findContact(user);
      if (contactEntry && contactEntry.unread) {
        contactEntry.unread = 0;
        saveContacts();
        renderContacts();
      }

      // Usa dados já salvos localmente enquanto busca a versão mais atual
      const cached = findContact(user);
      const avatarEl = document.getElementById('chat-avatar');
      renderAvatarInto(avatarEl, user, cached ? cached.avatar : null);
      setChatStatus(cached ? !!cached.online : false);

      try {
        const profileRes = await fetch('/api/user/' + encodeURIComponent(user));
        if (profileRes.ok) {
          const profile = await profileRes.json();
          renderAvatarInto(avatarEl, user, profile.avatar);
          setChatStatus(profile.online);
          updateContactInfo(user, { avatar: profile.avatar, online: profile.online });
        }
      } catch (err) { /* segue com os dados em cache */ }

      try {
        const res = await fetch('/messages/' + encodeURIComponent(user), {
          headers: { 'Authorization': 'Bearer ' + token },
        });
        const history = await res.json();
        history.forEach(appendBubble);
        scrollToBottom();
      } catch (err) { /* segue sem histórico se der erro de rede */ }
    }

    let chatContactOnline = false;
    function setChatStatus(online) {
      chatContactOnline = online;
      const el = document.getElementById('chat-contact-status');
      el.textContent = online ? 'online' : 'offline';
      el.className = 'status' + (online ? ' online' : '');
    }

    let remoteTypingTimeout = null;
    function setChatTypingDisplay(isTyping) {
      const el = document.getElementById('chat-contact-status');
      if (isTyping) {
        el.textContent = 'digitando...';
        el.className = 'status online';
        // Se não vier o aviso de "parou de digitar" por algum motivo, volta ao normal sozinho
        clearTimeout(remoteTypingTimeout);
        remoteTypingTimeout = setTimeout(() => setChatTypingDisplay(false), 4000);
      } else {
        clearTimeout(remoteTypingTimeout);
        el.textContent = chatContactOnline ? 'online' : 'offline';
        el.className = 'status' + (chatContactOnline ? ' online' : '');
      }
    }

    function appendBubble(msg) {
      const messagesEl = document.getElementById('messages');
      const row = document.createElement('div');
      const mine = msg.from_user === myUsername;
      row.className = 'bubble-row ' + (mine ? 'me' : 'them');

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      if (typeof msg.content === 'string' && msg.content.startsWith('data:image')) {
        const img = document.createElement('img');
        img.src = msg.content;
        bubble.appendChild(img);
      } else {
        bubble.textContent = msg.content;
      }

      row.appendChild(bubble);
      messagesEl.appendChild(row);
    }

    function scrollToBottom() {
      const messagesEl = document.getElementById('messages');
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const content = input.value.trim();
      if (!content || !currentChatUser || !socket) return;
      socket.emit('sendMessage', { to: currentChatUser, content });
      appendBubble({ from_user: myUsername, content });
      scrollToBottom();
      input.value = '';
      stopTypingSignal();
    }

    // ---------- Avisa em tempo real quando você está digitando ----------
    let isTypingSignalActive = false;
    let typingStopTimer = null;

    function startTypingSignal() {
      if (!currentChatUser || !socket) return;
      if (!isTypingSignalActive) {
        isTypingSignalActive = true;
        socket.emit('typing', { to: currentChatUser, isTyping: true });
      }
      clearTimeout(typingStopTimer);
      typingStopTimer = setTimeout(stopTypingSignal, 2000);
    }

    function stopTypingSignal() {
      clearTimeout(typingStopTimer);
      if (isTypingSignalActive && currentChatUser && socket) {
        socket.emit('typing', { to: currentChatUser, isTyping: false });
      }
      isTypingSignalActive = false;
    }

    document.getElementById('message-input').addEventListener('input', startTypingSignal);

    document.getElementById('message-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    // ---------- Envio de foto ----------
    async function sendPhoto(event) {
      const file = event.target.files[0];
      event.target.value = '';
      if (!file || !currentChatUser) return;
      const dataUrl = await resizeImage(file, 800, 0.7);
      socket.emit('sendMessage', { to: currentChatUser, content: dataUrl });
      appendBubble({ from_user: myUsername, content: dataUrl });
      scrollToBottom();
    }

    // ---------- Menu (⋮) — apagar histórico ----------
    function toggleChatMenu() {
      document.getElementById('chat-menu-overlay').classList.toggle('active');
    }
    function closeChatMenuIfOutside(event) {
      if (event.target.id === 'chat-menu-overlay') {
        document.getElementById('chat-menu-overlay').classList.remove('active');
      }
    }
    async function deleteHistory() {
      document.getElementById('chat-menu-overlay').classList.remove('active');
      if (!currentChatUser) return;
      if (!confirm('Apagar todo o histórico dessa conversa? Essa ação não pode ser desfeita.')) return;
      try {
        await fetch('/messages/' + encodeURIComponent(currentChatUser), {
          method: 'DELETE',
          headers: { 'Authorization': 'Bearer ' + token },
        });
        document.getElementById('messages').innerHTML = '';
      } catch (err) {
        alert('Não foi possível apagar o histórico agora. Tente de novo.');
      }
    }

    // ---------- Notificações ----------
    function requestNotificationPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission().then(() => setupPushSubscription());
      } else if ('Notification' in window && Notification.permission === 'granted') {
        setupPushSubscription();
      }
    }

    // Converte a chave pública (formato base64 usado na web) para o formato que o navegador espera
    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
      return outputArray;
    }

    // Registra o Service Worker e inscreve o navegador nas notificações push.
    // A partir daqui, o servidor consegue notificar mesmo com o app fechado
    // ou a tela do celular apagada.
    async function setupPushSubscription() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      if (!token) return;
      try {
        const registration = await navigator.serviceWorker.register('/sw.js');
        await navigator.serviceWorker.ready;

        const keyRes = await fetch('/api/push/vapid-public-key');
        const { publicKey } = await keyRes.json();

        let subscription = await registration.pushManager.getSubscription();
        if (!subscription) {
          subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(publicKey),
          });
        }

        await fetch('/api/push/subscribe', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ subscription }),
        });
      } catch (err) {
        console.log('Não foi possível ativar notificação push:', err);
      }
    }

    function showBrowserNotification(title, body) {
      if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
        try { new Notification(title, { body }); } catch (err) { /* ignora */ }
      }
    }

    // Toques de notificação gerados na hora (sem precisar de arquivo de áudio)
    function playTone(freq, duration, delay) {
      delay = delay || 0;
      setTimeout(() => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'square';
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.6, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
          osc.start();
          osc.stop(ctx.currentTime + duration);
          osc.onended = () => ctx.close();
        } catch (err) { /* navegador sem suporte, ignora */ }
      }, delay);
    }

    function playMessageSound() {
      playTone(1046, 0.16, 0);
      playTone(1568, 0.2, 130);
      if (navigator.vibrate) navigator.vibrate(200);
    }

    let ringtoneInterval = null;
    function startRingtone() {
      stopRingtone();
      const ring = () => {
        playTone(880, 0.4, 0);
        playTone(660, 0.4, 480);
        if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
      };
      ring();
      ringtoneInterval = setInterval(ring, 1700);
    }
    function stopRingtone() {
      if (ringtoneInterval) { clearInterval(ringtoneInterval); ringtoneInterval = null; }
    }

    // ---------- WebRTC (chamada de voz) ----------
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
    let peerConnection = null;
    let localStream = null;
    let callWith = null;
    let callState = 'idle'; // idle | calling | incoming | connected
    let pendingOffer = null;
    let callTimerInterval = null;
    let callSeconds = 0;
    let muted = false;

    function createPeerConnection() {
      peerConnection = new RTCPeerConnection(rtcConfig);
      peerConnection.onicecandidate = (e) => {
        if (e.candidate && callWith) {
          socket.emit('call:ice-candidate', { to: callWith, candidate: e.candidate });
        }
      };
      peerConnection.ontrack = (e) => {
        document.getElementById('remote-audio').srcObject = e.streams[0];
      };
      peerConnection.onconnectionstatechange = () => {
        if (!peerConnection) return;
        if (peerConnection.connectionState === 'connected' && callState !== 'connected') {
          setCallConnected();
        }
        if (['failed', 'disconnected', 'closed'].includes(peerConnection.connectionState) && callState !== 'idle') {
          endCall(false);
        }
      };
    }

    function showCallScreenFor(user) {
      const contact = findContact(user) || { username: user, avatar: null };
      document.getElementById('call-name-pill').textContent = contact.username;
      renderAvatarInto(document.getElementById('call-avatar-big'), contact.username, contact.avatar);
      goTo('screen-call');
    }

    function setCallControls(mode) {
      document.getElementById('call-controls-outgoing').style.display = mode === 'outgoing' ? 'flex' : 'none';
      document.getElementById('call-controls-incoming').style.display = mode === 'incoming' ? 'flex' : 'none';
      document.getElementById('call-controls-active').style.display = mode === 'active' ? 'flex' : 'none';
    }

    // ---------- Manter a tela ligada durante a chamada ----------
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) { /* alguns navegadores não suportam, tudo bem */ }
    }
    function releaseWakeLock() {
      if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
    }

    async function startCall() {
      if (!currentChatUser || callState !== 'idle') return;
      callWith = currentChatUser;
      callState = 'calling';
      showCallScreenFor(callWith);
      document.getElementById('call-status-text').textContent = 'Chamando...';
      setCallControls('outgoing');
      requestWakeLock();

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        alert('Não foi possível acessar o microfone. Verifique as permissões do navegador.');
        resetCallState();
        return;
      }
      createPeerConnection();
      localStream.getTracks().forEach((t) => peerConnection.addTrack(t, localStream));
      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      socket.emit('call:offer', { to: callWith, offer });
    }

    async function acceptCall() {
      stopRingtone();
      callState = 'connecting';
      document.getElementById('call-status-text').textContent = 'Conectando...';
      setCallControls('active');
      requestWakeLock();

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        alert('Não foi possível acessar o microfone. Verifique as permissões do navegador.');
        rejectCall();
        return;
      }
      createPeerConnection();
      localStream.getTracks().forEach((t) => peerConnection.addTrack(t, localStream));
      await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingOffer));
      const answer = await peerConnection.createAnswer();
      await peerConnection.setLocalDescription(answer);
      socket.emit('call:answer', { to: callWith, answer });
    }

    function rejectCall() {
      stopRingtone();
      if (callWith) socket.emit('call:reject', { to: callWith });
      resetCallState();
    }

    function setCallConnected() {
      callState = 'connected';
      document.getElementById('call-status-text').textContent = '00:00';
      setCallControls('active');
      callSeconds = 0;
      callTimerInterval = setInterval(() => {
        callSeconds++;
        const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
        const s = String(callSeconds % 60).padStart(2, '0');
        document.getElementById('call-status-text').textContent = m + ':' + s;
      }, 1000);
    }

    function toggleMute() {
      if (!localStream) return;
      muted = !muted;
      localStream.getAudioTracks().forEach((t) => { t.enabled = !muted; });
      const btn = document.getElementById('mute-btn');
      btn.textContent = muted ? '🔇' : '🎤';
      btn.classList.toggle('active', muted);
    }

    function endCall(notify) {
      stopRingtone();
      if (notify && callWith) socket.emit('call:end', { to: callWith });
      resetCallState();
    }

    function resetCallState() {
      if (peerConnection) { try { peerConnection.close(); } catch (e) {} peerConnection = null; }
      if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
      if (callTimerInterval) { clearInterval(callTimerInterval); callTimerInterval = null; }
      stopRingtone();
      releaseWakeLock();
      callWith = null;
      callState = 'idle';
      pendingOffer = null;
      muted = false;
      goTo(currentChatUser ? 'screen-chat' : 'screen-main');
    }

    // ---------- WebSocket ----------
    function connectSocket() {
      socket = io({ auth: { token } });

      socket.on('connect_error', (err) => {
        if (err.message === 'Token inválido' || err.message === 'Token não fornecido') {
          logout();
        }
      });

      socket.on('presence', ({ username, online }) => {
        updateContactInfo(username, { online });
        if (currentChatUser === username) setChatStatus(online);
      });

      socket.on('typing', ({ from, isTyping }) => {
        if (currentChatUser === from) setChatTypingDisplay(isTyping);
      });

      socket.on('message', (msg) => {
        const otherUser = msg.from_user === myUsername ? msg.to_user : msg.from_user;
        if (!findContact(otherUser)) {
          contacts.push({ username: otherUser, avatar: null, online: true, unread: 0 });
          saveContacts();
        }
        if (currentChatUser === otherUser) {
          appendBubble(msg);
          scrollToBottom();
        } else if (msg.from_user !== myUsername) {
          // Conversa não está aberta agora — soma no contador de não lidas
          const contactEntry = findContact(otherUser);
          if (contactEntry) contactEntry.unread = (contactEntry.unread || 0) + 1;
          saveContacts();
        }
        renderContacts();
        if (msg.from_user !== myUsername) {
          playMessageSound();
          showBrowserNotification(
            msg.from_user,
            msg.content.startsWith('data:image') ? '📷 Foto' : msg.content
          );
        }
      });

      // --- Sinalização de chamada ---
      socket.on('call:offer', ({ from, offer }) => {
        if (callState !== 'idle') {
          socket.emit('call:reject', { to: from });
          return;
        }
        callWith = from;
        callState = 'incoming';
        pendingOffer = offer;
        showCallScreenFor(from);
        document.getElementById('call-status-text').textContent = 'Chamada de voz recebida';
        setCallControls('incoming');
        startRingtone();
        showBrowserNotification(from, 'Chamada de voz recebida');
      });

      socket.on('call:answer', async ({ answer }) => {
        if (peerConnection) {
          await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
        }
      });

      socket.on('call:ice-candidate', async ({ candidate }) => {
        if (peerConnection) {
          try { await peerConnection.addIceCandidate(candidate); } catch (err) { /* ignora */ }
        }
      });

      socket.on('call:end', () => { if (callState !== 'idle') endCall(false); });
      socket.on('call:reject', () => {
        if (callState !== 'idle') {
          document.getElementById('call-status-text').textContent = 'Chamada recusada';
          setTimeout(() => resetCallState(), 900);
        }
      });
      socket.on('call:unavailable', () => {
        if (callState !== 'idle') {
          document.getElementById('call-status-text').textContent = 'Usuário offline';
          setTimeout(() => resetCallState(), 900);
        }
      });
    }

    // ---------- Inicialização ----------
    if (token && myUsername) {
      requestNotificationPermission();
      connectSocket();
      renderContacts();
      goTo('screen-main');
    }
  </script>
</body>
</html>
